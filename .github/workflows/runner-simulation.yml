name: F5 publisher simulation only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: f5-runner-simulation
  cancel-in-progress: false
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test mocked runner over local HTTP
        run: npm run test:runner
      - name: Test compiled isolated Worker and local D1/R2
        run: npm run test:runner:native
      # No schedule, deployment, repository secret or real API invocation.
