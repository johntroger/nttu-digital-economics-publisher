name: Code checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: code-checks-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a remote migration/deployment when a newer push arrives.
  cancel-in-progress: false
jobs:
  change-scope:
    name: Classify changes and check repository content
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_full: ${{ steps.scope.outputs.run_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Check repository even for documentation changes
        run: node scripts/check-repository.mjs
      - name: Classify the full commit range
        id: scope
        run: node scripts/ci-change-scope.mjs
  portable-checks:
    needs: change-scope
    if: needs.change-scope.outputs.run_full == 'true'
    name: Portable checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck, portable tests and repository content check
        run: npm run check:ci
      - name: Build Workers and test local D1 runtime
        if: matrix.os == 'ubuntu-latest'
        run: |
          node scripts/run-clean.mjs script scripts/production-management-smoke.mjs
          node scripts/run-clean.mjs script scripts/production-publisher-smoke.mjs
          npm run test:production-live
          npm run test:runner:native
          node scripts/run-clean.mjs script scripts/production-f6-native.mjs
          node scripts/run-clean.mjs script scripts/production-f7-native.mjs
          node scripts/run-clean.mjs script scripts/production-f7-rollback.mjs
          node scripts/run-clean.mjs script scripts/production-f12-native.mjs
