name: Schedule NTTU Facebook Reels
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: facebook-nttu-reels
  cancel-in-progress: false
jobs:
  schedule:
    if: github.repository == 'johntroger/nttu-digital-economics-publisher' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && github.sha == vars.PRODUCTION_RUNNER_RELEASE
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Schedule the verified R2 batch through Meta Graph API
        env:
          FACEBOOK_REELS_MANIFEST: ${{ secrets.FACEBOOK_NTTU_REELS_MANIFEST }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_META_PAGE_ACCESS_TOKEN }}
          META_APP_SECRET: ${{ secrets.PRODUCTION_META_APP_SECRET }}
        run: node scripts/run-clean.mjs script scripts/facebook-reels-schedule.mjs --apply
      - name: Retain scheduling receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: facebook-nttu-reels-receipt
          path: tmp/facebook-nttu-reels/schedule.json
          if-no-files-found: ignore
          retention-days: 14
