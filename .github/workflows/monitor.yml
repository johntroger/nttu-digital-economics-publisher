name: Independent staging monitor
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      send_test:
        description: Send one clearly labeled Telegram monitor test
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: independent-staging-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == 'refs/heads/main' && vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Read cloud state and deliver incident alerts
        run: node scripts/monitor.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
          STAGING_HEALTH_TOKEN: ${{ secrets.STAGING_HEALTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
          MONITOR_STATE_ISSUE: ${{ vars.MONITOR_STATE_ISSUE }}
          MONITOR_TELEGRAM_CHAT_ID: ${{ vars.MONITOR_TELEGRAM_CHAT_ID }}
          MONITOR_TELEGRAM_BOT_TOKEN: ${{ secrets.MONITOR_TELEGRAM_BOT_TOKEN }}
          MONITOR_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test }}
