name: Independent publisher monitor
on:
  schedule:
    - cron: '30 3 * * *'
    - cron: '45 3 * * 0'
  workflow_dispatch:
    inputs:
      monitor_target:
        description: Environment to check for a manual request
        type: choice
        options: [both, staging, production]
        default: both
      send_test:
        description: Send one clearly labeled Telegram monitor test
        type: boolean
        default: false
      trigger_source:
        description: Source of the monitor request
        type: choice
        options: [manual, cron-job.org]
        default: manual
      triggered_at:
        description: Unix seconds when the external scheduler sent this request
        type: string
        default: ''
permissions:
  contents: read
  issues: write
concurrency:
  group: independent-staging-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == 'refs/heads/main' && (vars.MONITOR_ENABLED == 'true' || vars.PRODUCTION_MONITOR_ENABLED == 'true') && (github.event_name != 'schedule' || vars.MONITOR_EXTERNAL_PRIMARY != 'true' || github.event.schedule == '45 3 * * 0')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Reserve free account quota before any provider probe or alert
        id: budget
        run: node scripts/run-clean.mjs script scripts/monitor-free-budget.mjs
        env:
          PRODUCTION_RUNNER_RELEASE: ${{ vars.PRODUCTION_RUNNER_RELEASE }}
          PRODUCTION_BILLING_POLICY: ${{ vars.PRODUCTION_BILLING_POLICY }}
          PRODUCTION_BILLING_READ_TOKEN: ${{ secrets.PRODUCTION_BILLING_READ_TOKEN }}
      - name: Read staging state and deliver incident alerts
        if: steps.budget.outputs.allowed == 'true' && vars.MONITOR_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.monitor_target != 'production')
        run: node scripts/run-clean.mjs script scripts/monitor.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_WORKER_URL: ${{ vars.STAGING_WORKER_URL }}
          STAGING_HEALTH_TOKEN: ${{ secrets.STAGING_HEALTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
          MONITOR_STATE_ISSUE: ${{ vars.MONITOR_STATE_ISSUE }}
          MONITOR_TELEGRAM_CHAT_ID: ${{ vars.MONITOR_TELEGRAM_CHAT_ID }}
          MONITOR_TELEGRAM_BOT_TOKEN: ${{ secrets.MONITOR_TELEGRAM_BOT_TOKEN }}
          MONITOR_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test }}
          MONITOR_CADENCE: daily
          MONITOR_TRIGGER_SOURCE: ${{ github.event_name == 'schedule' && 'github-schedule' || inputs.trigger_source || 'manual' }}
          MONITOR_TRIGGER_AT: ${{ inputs.triggered_at }}
      - name: Read production state and deliver incident alerts
        if: ${{ !cancelled() && steps.budget.outputs.allowed == 'true' && vars.PRODUCTION_MONITOR_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.monitor_target != 'staging') }}
        run: node scripts/run-clean.mjs script scripts/monitor.mjs
        env:
          MONITOR_TARGET: production
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_WORKER_URL: https://nttu-publisher-production.nttu-kts-johntroger.workers.dev
          PRODUCTION_D1_DATABASE_ID: 09cdecc7-36a2-4196-950e-ef68b1ecd834
          PRODUCTION_MONITOR_TOKEN: ${{ secrets.PRODUCTION_MONITOR_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MONITOR_STATE_ISSUE: ${{ vars.PRODUCTION_MONITOR_STATE_ISSUE }}
          MONITOR_TELEGRAM_CHAT_ID: ${{ vars.MONITOR_TELEGRAM_CHAT_ID }}
          MONITOR_TELEGRAM_BOT_TOKEN: ${{ secrets.MONITOR_TELEGRAM_BOT_TOKEN }}
          MONITOR_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test }}
          MONITOR_CADENCE: daily
          MONITOR_TRIGGER_SOURCE: ${{ github.event_name == 'schedule' && 'github-schedule' || inputs.trigger_source || 'manual' }}
          MONITOR_TRIGGER_AT: ${{ inputs.triggered_at }}
